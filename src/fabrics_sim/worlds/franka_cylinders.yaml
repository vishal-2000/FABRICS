# Franka obstacle course: table (top at z=0), static base box, and three cylinders of
# different heights inside the workspace. Primitive meshes are unit-sized (cylinder: diameter 1,
# height 1 along z; box: unit cube), so `scaling` = "diameter diameter height" / "sx sy sz".
# `transform` = x y z qx qy qz qw in the robot base frame.

table:
  env_index: all
  type: box
  scaling: 1.6 1.6 0.04
  transform: 0.4 0. -0.02 0. 0. 0. 1.

robot_base:
  env_index: all
  type: box
  scaling: 0.226 0.190 0.060
  transform: -0.041 0.000 0.030 0. 0. 0. 1.

pillar_tall:
  env_index: all
  type: cylinder
  scaling: 0.10 0.10 0.50
  transform: 0.60 0.20 0.25 0. 0. 0. 1.

pillar_mid:
  env_index: all
  type: cylinder
  scaling: 0.12 0.12 0.30
  transform: 0.45 -0.25 0.15 0. 0. 0. 1.

pillar_short:
  env_index: all
  type: cylinder
  scaling: 0.16 0.16 0.15
  transform: 0.72 -0.08 0.075 0. 0. 0. 1.
